# Litestream Configuration for Senjuku Nihongo on Google Cloud Run
# Replicates SQLite WAL frames continuously to Google Cloud Storage (GCS)

dbs:
  - path: /app/data/senjuku.db
    replicas:
      # LITESTREAM_GCS_BUCKET environment variable (e.g. gs://senjuku-sqlite-backup/db)
      - url: "${LITESTREAM_REPLICA_URL:-gcs://senjuku-sqlite-data/db}"
        sync-interval: 1s
        retention: 72h
